name: Build RazeVoice IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned .app
        run: |
          set -e
          cd RazeVoice
          xcodebuild clean build \
            -project RazeVoice.xcodeproj \
            -scheme RazeVoice \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Find and package IPA
        run: |
          APP_PATH=$(find DerivedData -name "RazeVoice.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not find RazeVoice.app"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r RazeVoice.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RazeVoice-unsigned
          path: RazeVoice.ipa
